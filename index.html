<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folio — PDF editor</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="tool-select">
  <header>
    <b>Folio</b>
    <span class="group">
      <button id="open" title="Open PDF (or drop one anywhere)">Open</button>
      <button id="merge" title="Append pages from PDFs or images (or drop them anywhere)">Insert</button>
      <button id="blank" title="Add a blank page">+ Page</button>
      <button id="ocr" title="Recognize text in scanned pages (runs on your device)">OCR</button>
      <button id="extract" title="Save a page range as a new PDF (Ctrl+click thumbnails to pre-fill it)">Extract</button>
      <button id="save" title="Download edited PDF">Save</button>
      <button id="print" title="Print">Print</button>
    </span>
    <span class="group" id="tools">
      <button data-tool="select" class="on">Select</button>
      <button data-tool="edit" title="Click existing text to change it">Edit text</button>
      <button data-tool="text">Add text</button>
      <button data-tool="whiteout" title="Cover content with white (hides it visually; the text underneath is NOT removed)">Whiteout</button>
      <button data-tool="redact" title="Black out content and delete it from the file when you save">Redact</button>
      <button data-tool="highlight">Highlight</button>
      <button data-tool="note" title="Add a comment (saved as a real PDF sticky note)">Note</button>
      <button data-tool="draw">Draw</button>
      <button data-tool="rect" title="Rectangle outline" aria-label="Rectangle">▭</button>
      <button data-tool="ellipse" title="Ellipse" aria-label="Ellipse">◯</button>
      <button data-tool="line" title="Line" aria-label="Line">╱</button>
      <button data-tool="arrow" title="Arrow" aria-label="Arrow">→</button>
      <button id="image">Image</button>
      <button id="sign">Sign</button>
    </span>
    <span class="group">
      <input id="color" type="color" value="#000000" title="Color">
      <select id="font" title="Font" aria-label="Font"></select>
      <input id="size" type="number" value="14" min="4" max="144" title="Font size" aria-label="Font size">
      <input id="stroke" type="number" value="2" min="0.5" max="40" step="0.5" title="Line width for Draw and shapes" aria-label="Line width">
    </span>
    <span class="group">
      <button id="undo" title="Undo (Ctrl+Z)" disabled>↶</button>
      <button id="redo" title="Redo (Ctrl+Y)" disabled>↷</button>
    </span>
    <span class="group">
      <input id="q" type="search" placeholder="Find (Ctrl+F)" aria-label="Find">
      <button id="prev" title="Previous match (Shift+Enter)" aria-label="Previous match">‹</button>
      <button id="next" title="Next match (Enter)" aria-label="Next match">›</button>
      <span id="hitCount"></span>
    </span>
    <span class="group">
      <button id="zoomOut" aria-label="Zoom out">−</button>
      <button id="zoomIn" aria-label="Zoom in">+</button>
    </span>
    <span id="status"></span>
  </header>
  <aside id="thumbs"></aside>
  <main id="viewer"><p class="empty">Open or drop a PDF or images to start — or click “+ Page” for a blank one.</p></main>
  <aside id="side" hidden>
    <div id="notes"></div>
    <div id="forms"></div>
  </aside>

  <input id="file" type="file" accept="application/pdf" hidden>
  <input id="mergeFile" type="file" accept="application/pdf,image/*" multiple hidden>
  <div id="printout"></div>
  <input id="imageFile" type="file" accept="image/*" hidden>

  <dialog id="sigDlg">
    <h3>Signature</h3>
    <canvas id="pad" width="500" height="160"></canvas>
    <p><button id="padClear">Clear</button> <button id="padUse">Use drawing</button></p>
    <p><input id="typed" placeholder="…or type your name"> <button id="typedUse">Use typed</button></p>
    <div id="saved"></div>
    <p><button id="sigClose">Cancel</button></p>
  </dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
